[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "SIM"]
# established style in this codebase, not bugs:
# E702 compact parser one-liners, E731/E741 short lambdas + l/r naming,
# B905 zips are equal-length by construction
ignore = ["E702", "E731", "E741", "B905"]
