version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: nuget
    directory: /plugin/VestRumble
    schedule:
      interval: monthly
    ignore:
      # pinned to the runtimes games actually ship: BepInEx 5.4.x bundles
      # its own Harmony build, and UnityEngine.Modules must match the
      # oldest Unity version we target
      - dependency-name: HarmonyX
      - dependency-name: BepInEx.BaseLib
      - dependency-name: UnityEngine.Modules
