name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: >
          pacman -Syu --noconfirm git dotnet-sdk github-cli python
          python-websockets python-bleak python-numpy python-evdev
          bluez libpulse openssl
      - name: Build VestRumble plugin
        run: dotnet build -c Release plugin/VestRumble
      - name: Build Arch package
        run: |
          useradd -m builder
          chown -R builder .
          cd packaging
          runuser -u builder -- makepkg -f --noconfirm
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" --generate-notes \
            packaging/*.pkg.tar.zst \
            plugin/VestRumble/bin/Release/net46/VestRumble.dll
